<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot UI with n8n Webhook</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 400px;
      height: 600px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: #0084ff;
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #ffffff;
      color: #0084ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .chat-header .info .title {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-header .info .status {
      font-size: 12px;
      opacity: 0.8;
    }

    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #f9f9f9;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.bot {
      align-self: flex-start;
      background-color: #e4e6eb;
      color: #050505;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      align-self: flex-end;
      background-color: #0084ff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .chat-footer {
      padding: 12px;
      background: white;
      border-top: 1px solid #e4e6eb;
      display: flex;
      gap: 8px;
    }

    .chat-footer input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }

    .chat-footer input:focus {
      border-color: #0084ff;
    }

    .chat-footer button {
      background-color: #0084ff;
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    .chat-footer button:hover {
      background-color: #006bce;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">AI</div>
      <div class="info">
        <div class="title">Assistant</div>
        <div class="status">Online</div>
      </div>
    </div>

    <div class="chat-body" id="chat-body">
      <div class="message bot">
        Halo! Ada yang bisa saya bantu hari ini?
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" id="chat-input" placeholder="Ketik pesan..." />
      <button type="button" id="send-btn">Kirim</button>
    </div>
  </div>

  <script>
    const N8N_WEBHOOK_URL = 'https://tanboppio.app.n8n.cloud/webhook/order-form-chat';

    const chatBody = document.getElementById('chat-body');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      chatInput.value = '';

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: text })
        });

        // Jika n8n mengembalikan status error, ambil detailnya
        if (!response.ok) {
          let errBody = '';
          try { errBody = await response.text(); } catch (e) { /* ignore */ }
          throw new Error('n8n HTTP ' + response.status + (errBody ? ': ' + errBody : ''));
        }

        // Baca body mentah lalu parse (aman kalau body kosong / bukan JSON)
        const raw = await response.text();
        let data = {};
        if (raw) {
          try { data = JSON.parse(raw); } catch (e) { data = { raw }; }
        }

        const botReply = data.output || data.message || data.text ||
          (raw ? raw : '⚠️ n8n merespons kosong. Cek tab Execution di n8n untuk detail error.');
        appendMessage(botReply, 'bot');
      } catch (error) {
        console.error(error);
        appendMessage('Error: ' + (error.message || 'Gagal terhubung ke webhook n8n.'), 'bot');
      }
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      chatBody.appendChild(msgDiv);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>

</body>
</html>
